name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ] # Укажи свою основную ветку, если она называется иначе

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject API Key
        run: |
          # Заменяем заглушку в index.html на реальный секрет из репозитория GitHub
          sed -i 's/YOUR_API_KEY_HERE/${{ secrets.GEMINI_API_KEY }}/g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
